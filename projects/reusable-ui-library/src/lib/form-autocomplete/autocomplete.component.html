<div
    class="autocomplete-container"
    [class.active]="isOpen"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="listbox"
    aria-owns="suggestions suggestions-history"
>
    <!-- Input -->
    <div class="input-container">
        <input
            #searchInput
            type="text"
            class="autocomplete-input"
            [attr.aria-label]="placeholder"
            aria-autocomplete="list"
            role="combobox"
            [attr.aria-expanded]="isOpen"
            placeholder="{{ placeholder }}"
            [(ngModel)]="query"
            (input)="onChange($event)"
            (focus)="handleFocus($event)"
            (blur)="onTouched($event)"
            [disabled]="disabled"
            autocomplete="off"
        />

        <!-- Clear -->
        <button
            *ngIf="query && !isLoading && !disabled"
            type="button"
            class="x"
            aria-label="Clear search"
            (click)="remove($event)"
        >
            <i class="material-icons" aria-hidden="true"> close </i>
        </button>

        <!-- Loading -->
        <div *ngIf="isLoading" class="sk-fading-circle" role="status" aria-label="Loading">
            <div class="sk-circle1 sk-circle"></div>
            <div class="sk-circle2 sk-circle"></div>
            <div class="sk-circle3 sk-circle"></div>
            <div class="sk-circle4 sk-circle"></div>
            <div class="sk-circle5 sk-circle"></div>
            <div class="sk-circle6 sk-circle"></div>
            <div class="sk-circle7 sk-circle"></div>
            <div class="sk-circle8 sk-circle"></div>
            <div class="sk-circle9 sk-circle"></div>
            <div class="sk-circle10 sk-circle"></div>
            <div class="sk-circle11 sk-circle"></div>
            <div class="sk-circle12 sk-circle"></div>
        </div>
    </div>

    <!-- Filtered List -->
    <div
        id="suggestions"
        class="suggestions-container"
        role="listbox"
        [class.is-hidden]="isHistoryListVisible"
        [class.is-visible]="!isHistoryListVisible"
    >
        <!-- Heading -->
        <div class="heading" *ngIf="filteredList.length > 0 && heading">
            <div class="text">{{ heading }}</div>
        </div>

        <ul #filteredListElement>
            <li
                *ngFor="let item of filteredList; let idx = index"
                class="item"
                role="option"
                [attr.aria-selected]="idx === selectedIdx"
            >
                <!-- String item -->
                <div *ngIf="isTypeString(item)" [class.complete-selected]="idx === selectedIdx" (click)="select(item)">
                    <ng-container
                        *ngTemplateOutlet="
                            itemTemplate;
                            context: {
                                $implicit: item | highlight: toHighlight
                            }
                        "
                    >
                    </ng-container>
                </div>

                <!-- Object item -->
                <div *ngIf="!isTypeString(item)" [class.complete-selected]="idx === selectedIdx" (click)="select(item)">
                    <ng-container
                        *ngTemplateOutlet="
                            itemTemplate;
                            context: {
                                $implicit: item | highlight: toHighlight : searchKeyword
                            }
                        "
                    >
                    </ng-container>
                </div>
            </li>
        </ul>
    </div>

    <!-- History List -->
    <div
        id="suggestions-history"
        class="suggestions-container"
        role="listbox"
        [class.is-hidden]="!isHistoryListVisible"
        [class.is-visible]="isHistoryListVisible"
    >
        <!-- History Heading -->
        <div class="heading" *ngIf="historyList.length > 0 && historyHeading">
            <div class="text">{{ historyHeading }}</div>

            <button type="button" class="x" aria-label="Clear search history" (click)="resetHistoryList($event)">
                <i class="material-icons" aria-hidden="true"> delete </i>
            </button>
        </div>

        <ul #historyListElement>
            <li
                *ngFor="let item of historyList; let idx = index"
                class="item"
                role="option"
                [attr.aria-selected]="idx === selectedIdx"
            >
                <!-- String item -->
                <div *ngIf="isTypeString(item)" [class.complete-selected]="idx === selectedIdx" (click)="select(item)">
                    <ng-container
                        *ngTemplateOutlet="
                            itemTemplate;
                            context: {
                                $implicit: item
                            }
                        "
                    >
                    </ng-container>
                </div>

                <!-- Object item -->
                <div *ngIf="!isTypeString(item)" [class.complete-selected]="idx === selectedIdx" (click)="select(item)">
                    <ng-container
                        *ngTemplateOutlet="
                            itemTemplate;
                            context: {
                                $implicit: item
                            }
                        "
                    >
                    </ng-container>
                </div>

                <!-- Remove history item -->
                <button
                    type="button"
                    class="x"
                    aria-label="Remove history item"
                    (click)="removeHistoryItem(idx, $event)"
                >
                    <i class="material-icons" aria-hidden="true"> close </i>
                </button>
            </li>
        </ul>
    </div>

    <!-- Not Found -->
    <div *ngIf="notFound && !isLoading" class="not-found">
        <ng-container
            *ngTemplateOutlet="
                notFoundTemplate;
                context: {
                    $implicit: notFoundText
                }
            "
        >
        </ng-container>
    </div>
</div>

<!-- Overlay -->
<div *ngIf="overlay" class="autocomplete-overlay" aria-hidden="true" (click)="handleOverlay()"></div>
